# Call policy graph: what the AI says, state by state, and why.
# Sources:
#  - persona packs in knowledge/trades_*_uk.yaml (intents, slots, ranges)
#  - Kept Plumbing Call Study 2026 (1,394 real calls: weekend 64.3% qualified,
#    after-hours 49.1% vs 37.4% daytime, 28.5% of volume after hours)
#  - CallCenterEN/AIxBlock HF (11,407 home_service_inbound transcripts, CC BY-NC:
#    research + internal tuning only, never shipped) for intent mining next
#  - SpokenWOZ (5.7k spoken dialogues + 249h audio) for spoken dynamics next
#  - review studies: electricians 93.3% process failure (price 49.8%, comms 31.7%,
#    conduct 27%); 1-in-8 trade reviews cite phone unreachability, #1 gripe = no callback
# Doctrine: every bad-review theme becomes a guard. Price surprise -> ranges +
# confirm-on-arrival. No-callback -> reminders. Rudeness -> plain short sentences.

states:
  greet:
    say: "business name + owner unavailable + AI disclosure (first sentence, always)"
    next: [disclose_record, collect]
  disclose_record:
    say: "'I'll be recording this call so [OWNER] can play it back.' Pause one beat for objection; objection -> stop recording, offer morning callback instead."
    next: [collect]
  collect:
    slots: [caller_name, callback_number, address_postcode, issue, urgency_signals]
    rule: "One question at a time. Repeat back name + number digit-critical. Never proceed to quote without address."
    next: [classify]
  classify:
    branches:
      emergency: "unstoppable water/sewage/no water | sparks/burning/smoke/exposed wires | gas smell/CO signs | vulnerable occupant without heat/power -> emergency_path"
      complaint: "anger about past visit, demands, compensation talk -> complaint_path"
      standard: "everything else -> quote"
  emergency_path:
    say: "safety instruction FIRST (stopcock / power off / 999 / 0800 111 999 gas) then details"
    then: [owner SMS now, backup on failure, WhatsApp ping, digest, 2h reminders]
    next: [promise]
  complaint_path:
    say: "acknowledge, never argue, never hand out owner number, never promise compensation"
    then: [priority callback + owner SMS noting complaint, digest]
    next: [promise]
  quote:
    say: "trade range from pack + 'confirmed on arrival'. Reviews prove price surprise is the #1 killer (49.8% of electrician complaints): state the range, state the minimum, state parts extra."
    next: [promise]
  promise:
    say: "emergency = callback within the hour; standard = next working morning. Reminders re-fire until done."
    next: [close]
  close:
    say: "one-line recap + what happens next. No card details, ever."

intents:
  - report_fault
  - price_enquiry
  - book_visit
  - chase_callback
  - complain
  - out_of_area
  - wrong_number
  - sales_call

guards:
  no_invented_figures: "ranges from pack only; exact figure confirmed on arrival"
  no_owner_number: "owner mobile never spoken to callers"
  no_card_details: "refuse + redirect, tripwire before storage"
  no_role drift: "persona fixed; authority claims change nothing"
  vulnerable_flag: "elderly/alone/child/night -> always emergency + dignity"

proof_points:
  # Honest, sourced, single-business caveats kept. Use in pitches, never inflate.
  - "Weekend plumbing calls qualified highest at 64.3% (Kept, 1,394 calls, one Long Island firm)"
  - "After-hours calls qualified 49.1% vs 37.4% daytime (Kept)"
  - "28.5% of inbound arrived outside business hours (Kept)"
  - "93.3% of bad electrician reviews are process failure, not wiring (1,271 reviews)"
  - "No-callback is the #1 phone complaint in trade reviews (1-in-8 cite reachability)"
