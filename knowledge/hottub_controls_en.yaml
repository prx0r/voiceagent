business:
  name: "SpaParts Direct"
  locale: "en-GB"
  phone: "+44 800 000 0000"
  hours:
    monday-friday: "09:00-17:00"
    saturday: "10:00-14:00"
    sunday: "closed"
agent:
  system_prompt: |
    You are customer support for SpaParts Direct. We specialise in hot tub
    control panels, circuit boards, and replacement parts for Nordic, Balboa,
    and Gecko systems. Use only graph evidence. If you don't know, say so.
    Escalate uncertainty about compatibility, pricing, or safety.
voice:
  edge_voice: "en-GB-SoniaNeural"
nodes:
  - id: business.main
    type: business
    name: SpaParts Direct
    text: "Specialist in hot tub control panels and replacement parts."

  - id: policy.compatibility
    type: policy
    name: Compatibility Policy
    aliases: [fits, compatible, replacement, will it work]
    text: "We verify compatibility based on model number, serial range, and photos. We cannot guarantee compatibility without photo and serial evidence."

  - id: policy.returns
    type: policy
    name: Returns Policy
    aliases: [return, refund, send back]
    text: "Unused parts can be returned within 30 days. Installed or custom parts require human review."

  - id: policy.pricing
    type: policy
    name: Pricing Policy
    aliases: [price, cost, how much, quote]
    text: "Prices depend on brand, model, and condition. We match or beat competitor pricing."

  - id: service.identify
    type: service
    name: Part Identification
    aliases: [what is this, identify, find part, help me find]
    text: "Send a photo of the control panel, the brand name, and any model numbers visible on the PCB or overlay."

  - id: service.install
    type: service
    name: Installation Service
    aliases: [install, fit, book, appointment]
    text: "We offer installation for control panels and spa packs. Book via phone or online."

  - id: balboa.vl
    type: product
    name: Balboa VL Series
    aliases: [Balboa, VL260, VL404, control panel]
    text: "Balboa VL series control panels. Check your spa brand and model year for compatibility. Price: £150-500."

  - id: balboa.tp
    type: product
    name: Balboa TP Series
    aliases: [TP60, TP800, TP1001]
    text: "Balboa TP topside panels. Must match your control box model."

  - id: gecko.k500
    type: product
    name: Gecko IN.K500
    aliases: [Gecko, IN.K500, Gecko panel]
    text: "Gecko IN.K500 control panel. Check your Gecko system model."

  - id: gecko.k800
    type: product
    name: Gecko IN.K800
    aliases: [IN.K800, Gecko upgrade]
    text: "Gecko IN.K800 — newer replacement for K500. May need adapter."

  - id: nordic.panel
    type: product
    name: Nordic Hot Tub Panel
    aliases: ["Nordic", "074102", "074112", "070046"]
    text: "Nordic control panels. Check your Nordic model number. We carry all 4-button and 5-button panels."

  - id: del.serial
    type: product
    name: Serial Number Guide
    aliases: [serial, model number, PCB number]
    text: "Find your serial on the PCB board, overlay, or control box. This determines which panel fits."

  - id: del.photo
    type: product
    name: Photo Requirements
    aliases: [photo, picture, image]
    text: "Send: 1) Photo of current panel, 2) Photo of PCB/board, 3) Any visible numbers."

  - id: faq.delivery
    type: faq
    name: Delivery Time
    aliases: [delivery, shipping, how long]
    text: "UK mainland: 1-3 working days. Express available."

  - id: faq.warranty
    type: faq
    name: Warranty
    aliases: [warranty, guarantee, returns]
    text: "All parts have manufacturer warranty. 30-day return policy for unused items."

edges:
  - source: service.identify
    target: balboa.vl
    relation: can_identify
  - source: service.identify
    target: gecko.k500
    relation: can_identify
  - source: service.identify
    target: nordic.panel
    relation: can_identify
  - source: service.identify
    target: del.serial
    relation: requires
  - source: service.identify
    target: del.photo
    relation: requires
  - source: balboa.vl
    target: policy.compatibility
    relation: requires
  - source: gecko.k500
    target: policy.compatibility
    relation: requires
  - source: service.install
    target: policy.pricing
    relation: requires
