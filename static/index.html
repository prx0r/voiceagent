<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Agent Kernel</title>
<style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px}#log{border:1px solid #ddd;border-radius:12px;padding:16px;min-height:320px}.m{margin:12px 0}.u{text-align:right}.a{white-space:pre-wrap}form{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:12px}button{padding:12px 16px}.ev{font-size:12px;color:#666}</style></head><body>
<h1>Support Agent Kernel</h1><p>Graph-grounded support demo. Edit <code>knowledge/*.yaml</code> to adapt it.</p><div id="log"></div>
<form id="f"><input id="q" placeholder="Ask about returns, services, opening hours…"><button>Send</button></form>
<script>let sid=localStorage.sid||null; const log=document.querySelector('#log'); document.querySelector('#f').onsubmit=async(e)=>{e.preventDefault();let q=document.querySelector('#q');let txt=q.value.trim();if(!txt)return; log.innerHTML+=`<div class="m u"><b>You:</b> ${txt}</div>`;q.value='';let r=await fetch('/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:txt,session_id:sid,speak:false})});let j=await r.json();sid=j.session_id;localStorage.sid=sid;log.innerHTML+=`<div class="m a"><b>Agent:</b> ${j.answer}</div><div class="ev">evidence: ${(j.evidence||[]).map(x=>x.id).join(', ')}</div>`;};</script></body></html>
