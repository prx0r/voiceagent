<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Answered — the receptionist for UK trades</title>
<meta name="description" content="Missed calls answered in your voice. Emergencies texted instantly. Everything else in a 7am email. 50p per active minute, no subscription.">
<style>
:root{
  --bg:#171717;--bg1:#181818;--bg2:#212121;--bg3:#2a2a2a;--bg4:#2f2f2f;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--text:#ececec;--dim:#b4b4b4;--dim2:#8f8f8f;
  --acc:#f5a524;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;
  --font:-apple-system-body,ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
.i{display:block;flex:0 0 auto}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:10px;border:3px solid var(--bg)}

#app{display:grid;height:100vh;height:100dvh;grid-template-columns:248px minmax(0,1fr) minmax(360px,32vw);grid-template-rows:52px minmax(0,1fr)}
/* top */
#top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:var(--bg1);z-index:5}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:16px;letter-spacing:-.01em}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px rgba(245,165,36,.6)}
.crumb{color:var(--dim2);font-size:13px;display:flex;align-items:center;gap:8px}
.crumb b{color:var(--text);font-weight:500}
#top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;white-space:nowrap}
.pill .live{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.btn{border-radius:999px;padding:7px 15px;font-weight:500;background:#fff;color:#0d0d0d;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--bg3)}
.mob{display:none}
/* rail */
#rail{border-right:1px solid var(--line);background:var(--bg1);display:flex;flex-direction:column;gap:1px;padding:10px 8px;overflow-y:auto;scrollbar-width:none}
.nb{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:9px;color:var(--dim);font-size:13.5px;text-align:left;text-decoration:none}
.nb:hover{background:var(--bg3);color:var(--text)}.nb.on{background:var(--bg4);color:var(--text)}
.nb .i{color:var(--dim2)}.nb.on .i{color:var(--acc)}
.nb small{margin-left:auto;font-size:11px;color:var(--dim2)}
.nh{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
.biz{display:flex;gap:10px;align-items:center;padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.biz .ic{width:34px;height:34px;border-radius:10px;background:var(--bg4);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.biz b{display:block;font-weight:600;font-size:14px;line-height:1.2}.biz span{font-size:12px;color:var(--dim2)}
.nb.back{color:var(--dim2);font-size:12.5px}
.rfoot{margin-top:auto;padding:12px 10px 4px;font-size:11.5px;color:var(--dim2);line-height:1.45}
.mcpbox{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.mcpbox code{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--text)}
.tl{list-style:none;margin:0 0 16px;padding:0}.tl li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.tl li b{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--acc)}.tl li span{display:block;color:var(--dim2);font-size:12.5px}
.why{margin:0 0 16px;padding-left:18px;color:var(--dim);font-size:13px}.why li{margin:3px 0}
pre.j{white-space:pre-wrap;font-size:12px;max-height:260px;overflow:auto}
.tr{width:64px;padding:8px 0 7px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim2);position:relative}
.tr .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.tr .lb{font-size:10.5px;line-height:1.15;text-align:center}
.tr:hover{color:var(--text)}.tr:hover .ic{background:var(--bg3)}
.tr.on{color:var(--text)}.tr.on .ic{background:var(--bg4);color:var(--acc)}
/* main */
#main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;isolation:isolate;background:radial-gradient(900px 420px at 30% -10%,rgba(245,165,36,.07),transparent 60%),var(--bg)}
#bgfx{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.55;pointer-events:none}
#thread{flex:1;overflow-y:auto;padding:28px 20px 12px;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto}
.msg{display:flex;gap:12px;margin:0 0 22px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:flex;align-items:center;justify-content:center;background:var(--bg3);color:var(--dim)}
.av.g{background:#fff;color:#111}.av.g .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.av.r{background:rgba(245,165,36,.14);color:var(--acc)}
.body{flex:1;min-width:0}
.who{font-size:12px;color:var(--dim2);margin:4px 0 3px;display:flex;gap:8px;align-items:center}
.tag{font-size:10.5px;border:1px solid var(--line2);border-radius:999px;padding:0 7px;color:var(--dim)}
.tag.cust{color:var(--acc);border-color:rgba(245,165,36,.35)}
.txt{font-size:15px;line-height:1.65;white-space:pre-wrap}
.msg.u{justify-content:flex-end}
.msg.u .body{flex:0 1 auto;max-width:78%;text-align:right}
.msg.u .txt{display:inline-block;text-align:left;background:var(--bg4);border-radius:20px;padding:9px 16px}
.msg.sys{justify-content:center;margin:6px 0 18px}
.msg.sys span{font-size:12px;color:var(--dim2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;display:inline-flex;gap:6px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{border:1px solid var(--line2);border-radius:14px;padding:12px 13px;background:rgba(33,33,33,.7);text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.stat:hover{border-color:rgba(255,255,255,.22)}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--dim);line-height:1.4}
.stat small{font-size:11px;color:var(--dim2);margin-top:auto;display:flex;gap:4px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:14px;padding:9px 13px;font-size:13.5px;text-align:left;color:var(--text);background:rgba(33,33,33,.6);transition:background .15s,border-color .15s;max-width:100%}
.chip:hover{background:var(--bg3);border-color:rgba(255,255,255,.2)}
.chip .k{color:var(--dim2)}
.chip.pri{background:#fff;color:#0d0d0d;border-color:#fff}.chip.pri .k{color:#555}
.tri{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--dim2)}.tri span{border:1px solid var(--line);border-radius:999px;padding:0 8px}.tri .i{color:var(--ok)}
.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.form input{flex:1 1 160px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none;font-size:15px}
.form input:focus{border-color:rgba(255,255,255,.3)}
.okline{color:var(--ok);font-size:13.5px;margin-top:8px}.errline{color:var(--bad);font-size:13.5px;margin-top:8px}
/* dock */
#dock{padding:4px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(23,23,23,0),var(--bg) 40%)}
.inbox{max-width:760px;margin:0 auto;background:var(--bg4);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:8px 8px 8px 8px;box-shadow:0 10px 40px -12px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px}
.inbox:focus-within{border-color:rgba(255,255,255,.16)}
.inbox input{background:transparent;border:0;outline:none;padding:8px 12px 4px;font-size:15.5px;min-width:0}
.inbox input::placeholder{color:var(--dim2)}
.row{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px}
.seg button{border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--dim);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--bg4);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.row .sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;color:var(--dim);display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--bg3);color:var(--text)}
.ib.rec{background:var(--bad);color:#fff}
.callb{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:rgba(52,211,153,.12);color:var(--ok);font-weight:500;font-size:13px}
.callb:hover{background:rgba(52,211,153,.2)}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#0d0d0d;display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.3;cursor:default}
.hint{max-width:760px;margin:6px auto 0;text-align:center;font-size:11.5px;color:var(--dim2)}
/* side */
#side{border-left:1px solid var(--line);background:var(--bg1);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:6px 11px;border-radius:9px;color:var(--dim);font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button:hover{color:var(--text);background:var(--bg2)}
.tabs button.on{color:var(--text);background:var(--bg3)}
.tabs .x{margin-left:auto;display:none}
.pane{flex:1;min-height:0;display:none;overflow-y:auto}
.pane.on{display:flex;flex-direction:column}
#p-website{padding:10px;overflow:hidden}
.frame{flex:1;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;border:1px solid var(--line2)}
.frame .bar{height:30px;background:#f2f2f2;display:flex;align-items:center;gap:8px;padding:0 10px;color:#555;font-size:11.5px}
.frame .bar a{margin-left:auto;color:#555;display:flex}
.frame iframe{flex:1;width:100%;border:0}
.pad{padding:16px}
.ph{font-size:12px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.ph .ro{text-transform:none;letter-spacing:0;border:1px solid var(--line2);border-radius:999px;padding:0 8px;font-size:11px}
.day{margin-bottom:16px}
.day h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
.ev{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:7px 10px;border-radius:10px;background:var(--bg2);margin-bottom:4px;font-size:13px}
.ev .t{color:var(--dim2);font-variant-numeric:tabular-nums}
.ev small{color:var(--dim2)}
.free{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.free span{font-size:12px;border:1px dashed rgba(52,211,153,.4);color:var(--ok);border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.note{display:grid;grid-template-columns:32px 1fr;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.note .a{width:32px;height:32px;border-radius:9px;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.note .a.red{background:rgba(248,113,113,.14);color:var(--bad)}.note .a.grn{background:rgba(52,211,153,.12);color:var(--ok)}
.note .hd{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.note .hd span{color:var(--dim2)}
.note p{margin:3px 0 0;font-size:13px;color:var(--dim);line-height:1.5}
.note.new{border-color:rgba(248,113,113,.4);animation:in .3s ease}
.plan{border:1px solid var(--line2);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.plan .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plan b{font-size:14.5px}.plan .pr{font-size:12.5px;color:var(--dim)}
.plan p{margin:4px 0 0;font-size:13px;color:var(--dim);line-height:1.5}
.plan.main{background:var(--bg2)}
pre{white-space:pre-wrap;font:12.5px/1.55 var(--mono);color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 14px}
/* call */
#call{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,10,10,.72);backdrop-filter:blur(16px)}
#call.on{display:flex}
.cbox{width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--bg2);border:1px solid var(--line2);border-radius:28px;padding:26px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 40px 100px -20px rgba(0,0,0,.8)}
.orb{width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd28a,#f5a524 45%,#7a4300);margin:6px 0 4px;transition:transform .2s;box-shadow:0 0 60px rgba(245,165,36,.35)}
.orb.talk{animation:breathe 1s ease-in-out infinite}.orb.listen{animation:breathe 2.4s ease-in-out infinite;filter:saturate(.7)}
@keyframes breathe{50%{transform:scale(1.07)}}
.cname{font-size:18px;font-weight:600}.cstate{font-size:13px;color:var(--dim)}
.ctrans{width:100%;flex:1;min-height:90px;max-height:240px;overflow-y:auto;font-size:13.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.ctrans p{margin:0 0 8px}.ctrans p b{color:var(--dim2);font-weight:500;margin-right:6px}
.cin{display:none;width:100%;gap:6px}.cin.on{display:flex}
.cin input{flex:1;background:var(--bg4);border:1px solid var(--line2);border-radius:999px;padding:10px 14px;outline:none;font-size:15px}
.cctl{display:flex;gap:14px;margin-top:6px}
.cctl button{width:54px;height:54px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center}
.cctl button.on{background:#fff;color:#111}
.cctl .end{background:#dc2626;color:#fff}
/* mobile */
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:52px auto minmax(0,1fr)}
  #app{grid-template-rows:52px minmax(0,1fr)}
  #rail{display:none}
  #side{display:none}
  body.side #side{display:flex;position:fixed;inset:52px 0 0;z-index:40;border-left:0}
  .tabs .x{display:flex}
  .mob{display:inline-flex}.pill,.crumb{display:none}
  #thread{padding:18px 14px 8px}
  #dock{padding:4px 10px calc(10px + env(safe-area-inset-bottom))}
  .stats{grid-template-columns:1fr}
  .stat{flex-direction:row;align-items:baseline;gap:10px}.stat small{display:none}
  .seg button span{display:none}
  .inbox input{font-size:16px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="app">
  <header id="top">
    <a class="logo" href="/"><span class="dot"></span>Answered</a>
    <span class="crumb" id="crumb"></span>
    <div class="sp"></div>
    <span class="pill"><span class="live"></span>50p per active minute · first 10 calls free</span>
    <button class="btn ghost mob" onclick="openSide()">Preview</button>
    <button class="btn" onclick="Tom.open(CUR)">Book a call with Tom</button>
  </header>
  <nav id="rail" aria-label="Your business"></nav>
  <main id="main"><canvas id="bgfx" aria-hidden="true"></canvas>
    <div id="thread"><div class="col" id="col"></div></div>
    <div id="dock">
      <div class="inbox">
        <input id="q" autocomplete="off" placeholder="Ask anything">
        <div class="row">
          <div class="seg" role="tablist" aria-label="Who you're talking to">
            <button id="m-guide" class="on" onclick="setMode('guide')"><span>Ask Answered</span></button>
            <button id="m-cust" onclick="setMode('customer')"><span>Be the customer</span></button>
          </div>
          <div class="sp"></div>
          <button class="ib" id="mic" title="Dictate" aria-label="Dictate" onclick="toggleMic()"></button>
          <button class="callb" id="callb" onclick="openCall()" title="Start a live call"></button>
          <button class="send" id="sendb" aria-label="Send" onclick="send()"></button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>
  <aside id="side">
    <div class="tabs" id="tabs">
      <button data-t="website">Website</button><button data-t="calendar">Diary</button><button data-t="phone">Your phone</button><button data-t="agents">AI agents</button><button data-t="plans">Prices</button><button data-t="prompt">Instructions</button>
      <button class="x ib" onclick="closeSide()" aria-label="Close" id="sidex"></button>
    </div>
    <div class="pane" id="p-website"><div class="frame"><div class="bar"><span id="lockic"></span><span id="url"></span><a id="openfull" target="_blank" rel="noopener" title="Open full site"></a></div><iframe id="site" title="Customer website preview"></iframe></div></div>
    <div class="pane" id="p-calendar"></div>
    <div class="pane" id="p-phone"></div>
    <div class="pane" id="p-agents"></div>
    <div class="pane" id="p-plans"></div>
    <div class="pane" id="p-prompt"></div>
  </aside>
</div>

<div id="call" role="dialog" aria-label="Live call">
  <div class="cbox">
    <div class="cstate" id="cdur">Calling…</div>
    <div class="orb" id="orb"></div>
    <div class="cname" id="cname"></div>
    <div class="cstate" id="cstate"></div>
    <div class="ctrans" id="ctrans"></div>
    <form class="cin" id="cin"><input id="cq" placeholder="Your browser can't listen. Type what you'd say" autocomplete="off"><button class="send" aria-label="Say" id="cqs"></button></form>
    <div class="cctl"><button id="cmute" title="Mute" aria-label="Mute" onclick="callMute()"></button><button class="end" title="End call" aria-label="End call" onclick="endCall()" id="cend"></button></div>
  </div>
</div>

<script src="/static/ui.js"></script>
<script src="/static/pricing.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLURAL={electrician:'electricians',plumber:'plumbers',heating:'heating engineers',locksmith:'locksmiths',beauty:'salons',barber:'barbers',dogwalker:'dog walkers',msp:'IT support',soletrader:'your trade'};
const SHORT={electrician:'Electrician',plumber:'Plumber',heating:'Heating',locksmith:'Locksmith',beauty:'Beauty',barber:'Barber',dogwalker:'Pet care',msp:'IT / MSP',soletrader:'Other trade'};
let IND=null,CUR=null,BOOT={},TABS='website';
const S={}; // per trade: {msgs,mode,done,gsid,csid,boot}
const st=()=>S[CUR]||(S[CUR]={msgs:[],mode:'guide',done:[],gsid:null,csid:null,alerts:[]});
const T=()=>IND.find(i=>i.slug===CUR);

async function boot(){
  $('#mic').innerHTML=icon('mic',18);$('#sendb').innerHTML=icon('up',18,2.2);$('#callb').innerHTML=icon('phone',15)+'<span>Call</span>';
  $('#lockic').innerHTML=icon('lock',11,2.2);$('#openfull').innerHTML=icon('ext',13);$('#sidex').innerHTML=icon('x',18);
  $('#cmute').innerHTML=icon('mic',22);$('#cend').innerHTML=icon('phone',22);$('#cqs').innerHTML=icon('up',18,2.2);
  try{meshBg($('#bgfx'),['#171717','#2d220f','#1b1b1b','#24190b'],{speed:.5,scale:.35})}catch(e){}
  for(let k=0;k<3&&!IND;k++){try{IND=(await (await fetch('/api/industries')).json()).industries}catch(e){await new Promise(r=>setTimeout(r,600))}}

  r.onresult=e=>{got=true;heard(e.results[0][0].transcript)};

  try{r.start()}catch(e){}

}
$('#cin').onsubmit=e=>{e.preventDefault();const v=$('#cq').value.trim();$('#cq').value='';if(v)heard(v)};
function callMute(){if(!CALL)return;CALL.muted=!CALL.muted;$('#cmute').classList.toggle('on',CALL.muted);$('#cmute').innerHTML=icon(CALL.muted?'mute':'mic',22);if(CALL.muted){try{CALL.rec&&CALL.rec.abort()}catch(e){};cstate('Muted','')}else listen()}
function endCall(){
  if(!CALL)return;const c=CALL;CALL=null;clearInterval(c.timer);try{speechSynthesis.cancel();c.rec&&c.rec.abort()}catch(e){}
  $('#call').classList.remove('on');
  const s=S[c.slug],sec=Math.floor((Date.now()-c.start)/1000),dur=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  if(c.lines.length<=1){s.msgs.push({r:'sys',ic:'phone',t:`Call ended · ${dur} · no words heard`});s.msgs.push({r:'g',t:c.SR?'I didn\'t catch anything on that one. Check your mic is allowed and ring again, or type as the customer instead.':'Your browser can\'t listen, so type your lines in the call box next time, or switch to Chrome or Edge to talk.',chips:funnel(c.slug)});if(c.slug===CUR)paint();return}
  {
    s.msgs.push({r:'sys',ic:'phone',t:`Live call · ${dur}${c.urgent?' · urgent alert sent to you':''}`});
    c.lines.forEach(l=>s.msgs.push(l.r==='u'?{r:'u',t:l.t,cust:1}:{r:'a',t:l.t}));
    if(!s.done.includes('call'))s.done.push('call');
    const mins=Math.max(1,Math.ceil(sec/60));
    s.msgs.push({r:'g',t:`That call would cost ${mins*50}p. The transcript and a recording go in your 7am digest${c.urgent?', and the urgent alert is already on your phone':''}.`,chips:funnel(c.slug)});
    if(c.slug===CUR){paint();paintPhone()}
  }
}

/* ---------- wiring ---------- */
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});
addEventListener('message',e=>{if(e.source===$('#site').contentWindow&&e.data&&e.data.type==='answered-ask'&&typeof e.data.text==='string'){setMode('customer');send(e.data.text.slice(0,400))}});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus()}if(e.key==='Escape'){if(CALL)endCall();else closeSide()}});

try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
boot();
</script>
